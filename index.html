<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="calc-container">
            <div class="display">
            </div>
            <div class="buttons">
                <div class="row-1">
                    <button>C</button>
                    <button>&#x232B;</button>
                    <button>&divide;</button>
                    <button>&times;</button>
                </div>
                <div class="row-2">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>&plus;</button>
                </div>
                <div class="row-3">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>&minus;</button>
                </div>
                <div class="row-4">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>.</button>
                </div>
                <div class="row-5">
                    <button>0</button>
                    <button>&equals;</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
