<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="calc-container">
            <div class="display">
                <p id="result">1.524265 × 10⁶</p>
            </div>
            <div class="buttons">
                <div class="row-1">
                    <button id="clear">C</button>
                    <button id="delete">&#x232B;</button>
                    <button class="operator" id="divide">&divide;</button>
                    <button class="operator" id="times">&times;</button>
                </div>
                <div class="row-2">
                    <button class="num">7</button>
                    <button class="num">8</button>
                    <button class="num">9</button>
                    <button class="operator" id="plus">&plus;</button>
                </div>
                <div class="row-3">
                    <button class="num">4</button>
                    <button class="num">5</button>
                    <button class="num">6</button>
                    <button class="operator" id="minus">&minus;</button>
                </div>
                <div class="row-4">
                    <button class="num">1</button>
                    <button class="num">2</button>
                    <button class="num">3</button>
                    <button class="num">.</button>
                </div>
                <div class="row-5">
                    <button class="num">0</button>
                    <button id="equals">&equals;</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
